name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      deploy_test:
        description: Create or update the complete isolated test environment
        required: true
        type: boolean
        default: false
      backend_ref:
        description: Backend branch, tag, or commit to deploy to test
        required: true
        type: string
        default: main
      frontend_ref:
        description: Frontend branch, tag, or commit to deploy to test
        required: true
        type: string
        default: main

permissions:
  contents: read

env:
  ACR_NAME: acraiacademy26
  IMAGE_NAME: team3-backend
  TF_STATE_CONTAINER: tfstate
  TF_STATE_RESOURCE_GROUP: rg-team3-tfstate
  TF_STATE_STORAGE_ACCOUNT: stteam3tfstate26
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  TF_VAR_environment: dev
  TF_VAR_location: uksouth
  TF_VAR_project_name: team3
  TF_VAR_deployment_principal_object_id: 8bdf433d-761a-4cd1-ba09-85754a1e0eef
  TF_VAR_acr_name: acraiacademy26
  TF_VAR_acr_resource_group_name: rg-ai-academy-26
  TF_VAR_backend_image_tag: ${{ github.sha }}
  TF_VAR_container_revision_suffix: rev-${{ github.run_id }}
  TF_VAR_enable_swagger_docs: "true"
  TF_VAR_log_retention_in_days: "30"
  # JSON array of Entra object IDs, set as the GRAFANA_ADMIN_OBJECT_IDS repository variable.
  TF_VAR_grafana_admin_object_ids: ${{ vars.GRAFANA_ADMIN_OBJECT_IDS != '' && vars.GRAFANA_ADMIN_OBJECT_IDS || '[]' }}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_test && 'test-environment-deployment' || format('ci-{0}-{1}', github.workflow, github.event.pull_request.number || github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-source:
    name: Resolve source
    runs-on: ubuntu-latest
    outputs:
      backend_sha: ${{ steps.backend_source.outputs.sha }}
      frontend_sha: ${{ steps.frontend_source.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_test && inputs.backend_ref || github.sha }}
      - name: Record backend source commit
        id: backend_source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Resolve frontend source commit
        if: github.event_name == 'workflow_dispatch' && inputs.deploy_test
        id: frontend_source
        env:
          FRONTEND_REF: ${{ inputs.frontend_ref }}
          GH_TOKEN: ${{ secrets.FRONTEND_REPOSITORY_DISPATCH_TOKEN }}
        run: |
          encoded_ref=$(jq --null-input --raw-output --arg ref "$FRONTEND_REF" '$ref | @uri')
          sha=$(gh api "repos/kainos-birmingham-academy-2026/team3-frontend/commits/${encoded_ref}" --jq '.sha')
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  test:
    name: Lint and test
    needs: resolve-source
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || 'file:./dev.db' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.backend_sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Lint
        run: npm run lint
      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build container image
    needs: [resolve-source, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.backend_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image with registry-free cache
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            team3-backend:${{ needs.resolve-source.outputs.backend_sha }}
            team3-backend:latest
          cache-from: type=gha,scope=team3-backend
          cache-to: type=gha,mode=max,scope=team3-backend

  push-image:
    name: Push image to ACR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [resolve-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.backend_sha }}
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to ACR
        run: az acr login --name "$ACR_NAME"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ needs.resolve-source.outputs.backend_sha }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha,scope=team3-backend
          cache-to: type=gha,mode=max,scope=team3-backend
      - name: Verify images exist in ACR
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.backend_sha }}
        run: |
          az acr repository show --name "$ACR_NAME" --image "${IMAGE_NAME}:${SOURCE_SHA}" --only-show-errors
          az acr repository show --name "$ACR_NAME" --image "${IMAGE_NAME}:dev-latest" --only-show-errors

  push-test-image:
    name: Push test image to ACR
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_test
    needs: [resolve-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve-source.outputs.backend_sha }}
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign in to ACR
        run: az acr login --name "$ACR_NAME"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:test-${{ needs.resolve-source.outputs.backend_sha }}
          cache-from: type=gha,scope=team3-backend
          cache-to: type=gha,mode=max,scope=team3-backend
      - name: Verify test image exists in ACR
        env:
          SOURCE_SHA: ${{ needs.resolve-source.outputs.backend_sha }}
        run: az acr repository show --name "$ACR_NAME" --image "${IMAGE_NAME}:test-${SOURCE_SHA}" --only-show-errors

  terraform-plan:
    name: Plan dev infrastructure
    if: github.event_name == 'pull_request'
    needs: [resolve-source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
    env:
      TF_VAR_postgresql_administrator_password: ${{ secrets.POSTGRESQL_ADMINISTRATOR_PASSWORD }}
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Install tfcmt
        env:
          TFCMT_VERSION: 4.14.18
        run: |
          curl --fail --silent --show-error --location \
            --output /tmp/tfcmt.tar.gz \
            "https://github.com/suzuki-shunsuke/tfcmt/releases/download/v${TFCMT_VERSION}/tfcmt_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            --output /tmp/tfcmt_checksums.txt \
            "https://github.com/suzuki-shunsuke/tfcmt/releases/download/v${TFCMT_VERSION}/tfcmt_${TFCMT_VERSION}_checksums.txt"
          grep '  tfcmt_linux_amd64.tar.gz$' /tmp/tfcmt_checksums.txt \
            | sed 's#tfcmt_linux_amd64.tar.gz#/tmp/tfcmt.tar.gz#' \
            | sha256sum --check
          tar --extract --gzip --file /tmp/tfcmt.tar.gz --directory /tmp tfcmt
          sudo install /tmp/tfcmt /usr/local/bin/tfcmt
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize Terraform
        run: >-
          terraform init
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}"
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}"
          -backend-config="container_name=${TF_STATE_CONTAINER}"
          -backend-config="key=team3-backend-dev.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Validate Terraform
        run: terraform validate
      - name: Plan Terraform changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tfcmt -var "target:backend-dev" plan -- terraform plan -no-color

  terraform-deploy:
    name: Deploy dev infrastructure
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [resolve-source, push-image]
    runs-on: ubuntu-latest
    concurrency:
      group: backend-infrastructure-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_postgresql_administrator_password: ${{ secrets.POSTGRESQL_ADMINISTRATOR_PASSWORD }}
      TF_VAR_backend_image_tag: ${{ needs.resolve-source.outputs.backend_sha }}
    defaults:
      run:
        working-directory: infrastructure/environments/dev
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize Terraform
        run: >-
          terraform init
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}"
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}"
          -backend-config="container_name=${TF_STATE_CONTAINER}"
          -backend-config="key=team3-backend-dev.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Validate Terraform
        run: terraform validate
      - name: Bootstrap Key Vault secret permissions
        run: >-
          terraform apply
          -auto-approve
          -target=time_sleep.secrets_rbac_propagation
      - name: Create Terraform plan
        run: terraform plan -out=tfplan
      - name: Apply Terraform plan
        run: terraform apply -auto-approve tfplan
      - name: Trigger frontend dev deployment
        env:
          GH_TOKEN: ${{ secrets.FRONTEND_REPOSITORY_DISPATCH_TOKEN }}
        run: >-
          gh api
          --method POST
          repos/kainos-birmingham-academy-2026/team3-frontend/dispatches
          --field event_type=backend-dev-deployed

  terraform-deploy-test:
    name: Deploy test infrastructure
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_test
    needs: [resolve-source, push-test-image]
    runs-on: ubuntu-latest
    concurrency:
      group: backend-infrastructure-test
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_environment: test
      TF_VAR_backend_image_tag: test-${{ needs.resolve-source.outputs.backend_sha }}
      TF_VAR_container_revision_suffix: test-${{ github.run_id }}
    defaults:
      run:
        working-directory: infrastructure/environments/test
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive ../..
      - name: Initialize isolated test state
        run: >-
          terraform init
          -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}"
          -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}"
          -backend-config="container_name=${TF_STATE_CONTAINER}"
          -backend-config="key=team3-backend-test.tfstate"
          -backend-config="use_azuread_auth=true"
      - name: Validate Terraform
        run: terraform validate
      - name: Bootstrap test Key Vault secret permissions
        run: >-
          terraform apply
          -auto-approve
          -target=time_sleep.secrets_rbac_propagation
      - name: Create test Terraform plan
        run: terraform plan -out=tfplan
      - name: Apply test Terraform plan
        run: terraform apply -auto-approve tfplan
      - name: Trigger frontend test deployment
        env:
          FRONTEND_SHA: ${{ needs.resolve-source.outputs.frontend_sha }}
          GH_TOKEN: ${{ secrets.FRONTEND_REPOSITORY_DISPATCH_TOKEN }}
        run: >-
          gh api
          --method POST
          repos/kainos-birmingham-academy-2026/team3-frontend/dispatches
          --field event_type=backend-test-deployed
          --raw-field "client_payload[frontend_ref]=${FRONTEND_SHA}"
