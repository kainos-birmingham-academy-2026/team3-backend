name: team3-dev-stack

services:
  db:
    image: postgres:16-alpine
    container_name: team3-db
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: jobRoles
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jobRoles"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: team3-backend
    working_dir: /app
    env_file:
      - .env.dev
    ports:
      - "4000:4000"
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      - ./tsconfig.json:/app/tsconfig.json:ro
      - ./prisma.config.ts:/app/prisma.config.ts:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../team3-frontend
      dockerfile: Dockerfile.dev
    container_name: team3-frontend
    working_dir: /app
    env_file:
      - .env.dev
    ports:
      - "3000:3000"
    volumes:
      - ../team3-frontend/src:/app/src
      - ../team3-frontend/public:/app/public
      - ../team3-frontend/tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      backend:
        condition: service_started

volumes:
  db_data:
